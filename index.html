<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Haven Lofts — Lakeville, MN Hair Salon</title>
    <meta name="description" content="Haven Lofts is a hair salon in Lakeville, Minnesota, owned by Sara and Leah. By appointment only." />
    <meta property="og:title" content="Haven Lofts — Lakeville, MN Hair Salon" />
    <meta property="og:description" content="Haven Lofts is a hair salon in Lakeville, Minnesota, owned by Sara and Leah. By appointment only." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta property="og:image" content="https://havenloftsmn.com/haven-lofts-poster.jpg" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F2EFEA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1A17" media="(prefers-color-scheme: dark)" />
    <script>
      // Set the theme before the page paints, so there is no flash of the wrong one.
      (function () {
        var t;
        try { t = localStorage.getItem('haven-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        // The phone status bar follows the site's own theme switch, not only the OS setting.
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = t === 'dark' ? '#1B1A17' : '#F2EFEA'; });
        document.documentElement.classList.add('js');
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HairSalon",
        "name": "Haven Lofts",
        "url": "https://havenloftsmn.com/",
        "image": "https://havenloftsmn.com/haven-lofts-poster.jpg",
        "logo": "https://havenloftsmn.com/haven-lofts-logo.png",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "17685 Juniper Path, Suite 204",
          "addressLocality": "Lakeville",
          "addressRegion": "MN",
          "postalCode": "55044",
          "addressCountry": "US"
        },
        "founder": [
          { "@type": "Person", "name": "Sara" },
          { "@type": "Person", "name": "Leah" }
        ]
      }
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gloock&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
