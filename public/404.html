<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · Haven Lofts</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Albert+Sans:wght@400;600&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem('haven-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <style>
      /* Same palette as the site (src/index.css), so a wrong link still feels like Haven Lofts. */
      :root { --bg: #F6EFE4; --ink: #2B211C; --ink-soft: #5C4D42; --cognac: #9A4F2E; --gold: #B8893B; --gold-ink: #8A6526; --btn: #2B211C; --btn-ink: #F6EFE4; }
      [data-theme='dark'] { --bg: #1A1C15; --ink: #F0E6D3; --ink-soft: #CBBDA6; --cognac: #D9946A; --gold: #D4AA5E; --gold-ink: #E0BC74; --btn: #D4AA5E; --btn-ink: #1A1C15; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 2rem 1.25rem;
        background: var(--bg); color: var(--ink); font-family: 'Albert Sans', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { width: 100%; max-width: 34rem; border: 1.5px solid var(--gold); padding: 6px; }
      .inner { border: 1px solid var(--gold); padding: clamp(2rem, 6vw, 3.5rem); }
      .logo { width: 9rem; height: auto; display: block; }
      [data-theme='dark'] .logo-light, :root:not([data-theme='dark']) .logo-dark { display: none; }
      .kicker { display: flex; align-items: center; gap: 0.9rem; margin: 2.5rem 0 0; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold-ink); }
      .kicker::before { content: ''; width: 2.75rem; height: 1px; background: var(--gold); }
      h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: clamp(2.75rem, 9vw, 4rem); line-height: 0.98; letter-spacing: -0.012em; margin: 1.25rem 0 0; }
      h1 em { font-style: italic; font-weight: 400; color: var(--cognac); }
      p { font-size: 1.125rem; line-height: 1.7; color: var(--ink-soft); margin: 1.25rem 0 0; }
      a.btn {
        display: inline-flex; align-items: center; gap: 0.9rem; margin-top: 2rem; height: 3.5rem; padding: 0 2rem;
        border-radius: 999px; background: var(--btn); color: var(--btn-ink); font-weight: 600; text-decoration: none;
        transition: transform 500ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 500ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      a.btn:hover { transform: translateY(-2px); box-shadow: 0 18px 34px -18px rgb(0 0 0 / 0.45); }
      a.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
      .addr { font-size: 0.95rem; margin-top: 2.5rem; }
      @media (prefers-reduced-motion: reduce) { a.btn { transition: none; } a.btn:hover { transform: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="inner">
        <a href="/" aria-label="Haven Lofts home">
          <img class="logo logo-light" src="/haven-lofts-logo.png" alt="Haven Lofts" />
          <img class="logo logo-dark" src="/haven-lofts-logo-light.png" alt="Haven Lofts" />
        </a>
        <p class="kicker">Page not found</p>
        <h1>This page <em>wandered off.</em></h1>
        <p>The link may be old or mistyped. Everything you're looking for (services, Sarah &amp; Leah, and how to find us) is on the home page.</p>
        <a class="btn" href="/">Back to Haven Lofts</a>
        <p class="addr">17685 Juniper Path, Suite 204 · Lakeville, MN 55044 · By appointment only</p>
      </div>
    </main>
  </body>
</html>
